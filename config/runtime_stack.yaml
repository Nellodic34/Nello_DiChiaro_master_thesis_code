# Runtime configuration for the two-observer bearing-only tracking stack.
# Every value in this file is the one the nodes actually read.
#
# The reasoning -- ranges, what moving a number does, what each boolean switches,
# and the measurements behind the values -- lives in docs/config_rationale.md.
# Start from its "Check before every flight" table.

launcher:
  drone_run_mode: "decentralized_evaluation"  # one of: simple_detection, decentralized, decentralized_evaluation
  use_sim_time: false  # REAL DRONES: no /clock, wall time only
  # Read only by the sim/bag tmux launcher (one_drone/generate_runtime_stack.py),
  # not by anything in this repo. Kept for parity with that tree.
  # Which node its tmux session starts: none | detection | triangulation | decentralized.
  auto_start_node: triangulation

vision:
  publish_annotated_image: true  # detection boxes on /detection...; Labeled images visible on rqt. Costs bandwidth
  publish_debug_annotated_image: true  # per-observer ray overlays on /{drone}/triangulation_debug_annotated/compressed
  publish_detector_evaluation_packets: true  # false = observer emits no evaluator telemetry
  publish_camera_static_tf: true  # MUST STAY TRUE on drones: without it there is no fcu->camera TF, so no rays
  model_path: "dataset_tools/weights8/best_openvino_model"  # YOLO/OpenVINO weights for observer_node; relative paths are resolved from the repo root
  device: "cpu"  # inference device: "cpu" for Intel drone, "cuda" for GPU, "GPU" for Intel iGPU via OpenVINO
  observation_topic_name: "target_observation"  # per-observer frozen 3D measurement topic suffix, e.g. /uav1/target_observation
  allow_tf_fallback: true  # true = use the latest TF when the exact frame-time TF is missing
  max_tf_delta_ms: 40.0  # image/TF skew budget (ms); packets exceeding it are rejected
  observer_image_topic: "/uav8/rgbd/color/image_raw/compressed"  # observer2 = uav8; camera_info derived as /uav8/rgbd/color/camera_info
  main_image_topic: "/uav11/rgbd/color/image_raw/compressed"  # observer1 = uav11; camera_info derived as /uav11/rgbd/color/camera_info
  observer_camera_info_topic: ""  # role-specific CameraInfo override for observer2; empty = derive from observer_image_topic
  main_camera_info_topic: ""  # role-specific CameraInfo override for observer1/main; empty = derive from main_image_topic
  roi_crop_enabled: true  # use ROI mode when a valid predicted center exists; false = always full-frame
  roi_reference_imgsz: 256  # reference ROI side (px) defining the base crop, not the YOLO imgsz
  roi_margin_multiplier: 1.40  # expands the search area around the predicted center
  roi_min_size_px: 200  # 1080 | 720: 133 | 480: 67. Reject ROI mode if the real crop becomes smaller
  roi_track_timeout_sec: 0.5  # after this time without updates, drop the ROI track and reacquire globally
  roi_full_scan_interval: 20  # every N frames force one full-frame scan to recover from drift or missed target
  roi_init_m: 3  # start an ROI track only if at least M detections are mutually consistent ...
  roi_init_n: 5  # ... within the last N candidate detections
  roi_init_max_spread_px: 80  # 1080 | 720: 53 | 480: 27 -- px spread the N detections must fall within
  roi_selection_lambda: 0.3  # penalty on detections far from the predicted center while ROI is active
  camera_frame_override: ""  # override camera frame_id for TF lookups; empty = take it from CameraInfo
  publish_rviz_markers: false  # predicted trajectory & position markers to RViz (disable to save CPU)

tight_coupling:
  # 3D->2D feedback: the 3D estimate gates each observer's detections.
  enabled: false  # IF TRIANGULATION IS DECENT GO TRUE master switch; false = pure loose coupling (identical to current behavior)
  target_odometry_topic: "/target/odometry_estimate"  # topic published by triangulation_node
  max_3d_age_sec: 0.5  # ignore 3D state older than this (stale data = no feedback)
  max_3d_covariance_trace: 100.0  # if tr(P_pos) > this, the 3D estimate is too uncertain → disable feedback
  gating_chi2_threshold: 9.21  # chi² threshold for 2-DOF gate (99% confidence interval for 2 DOF)
  sigma_v_inflate: 1.5  # [m/s] velocity uncertainty gate inflation over dt (use 1-2)
  r_pixel_sigma_px: 10.0  # 1080 | 720: 6.7 | 480: 3.3 -- px, pinhole noise floor

camera_tf:
  # Camera mount offsets per role. Empty/zero on purpose in the deploy tree.

  observer1:  # main drone camera mount
    x: 0.085  # metres, camera offset from fcu
    y: 0.0
    z: -0.085
    roll: 0.0  # radians
    pitch: 0.0  # PROVISIONAL. Do not tune here: the bias is per-boot, see docs/config_rationale.md
    yaw: 0.0  # 0.0: origin frames are nord-aligned, no camera yaw exists
    yaw_offset: 0.0  # [GENERAL] world-origin heading alignment (radians)

  observer2:  # observer drone camera mount
    x: 0.085  # metres, camera offset from fcu
    y: 0.0
    z: -0.085
    roll: 0.0  # radians
    pitch: 0.0  # PROVISIONAL. Do not tune here: the bias is per-boot, see docs/config_rationale.md
    yaw: 0.0  # 0.0: origin frames are nord-aligned, no camera yaw exists
    yaw_offset: 0.0  # [GENERAL] world-origin heading alignment (radians)
  child_frame: "rgbd_link"  # camera driver frame name (same on all drones)

#%%%%%%%ALWAYS NONE WHEN FLYING%%%%%%%%%%%%%%%%%%%
bag_profile: "none"  # "none" WHEN FLYING

bag_profiles:
  # Per-flight survey constants. Deploy uses "none"; the rest is for bag replay.
  none: {}  # no per-flight correction -- the only valid value for a real flight

  temesvar_A:  # merged/A_17-21_stereo_ok

    bearing_bias:

      observer1:  # uav11 -- tilt el -4.23 deg, residual rms 1.37 -> 0.57 deg
        az_deg: 0.57  # bag replay only (deg)
        el_deg: -4.23  # bag replay only (deg)

      observer2:  # uav8 -- tilt el +4.92 deg, residual rms 1.81 -> 0.58 deg
        az_deg: 0.80  # bag replay only (deg)
        el_deg: 4.92  # bag replay only (deg)
    target_gt_z_offset_m: -0.90  # bag replay only (m)

simulation:
  drone_count: 3  # allowed values: 1, 2, 3

uav_roles:
  observer1: uav11  # main/triangulating drone (22-7 bag)
  observer2: uav8  # secondary observer drone (22-7 bag)
  target: uav2  # TARGET drone name edit to match your real drone
shared_heading: false  # STATIC BENCH ONLY -- ALWAYS FALSE EXCEPT FOR TESTING

ekf:
  kf_process_noise_acc: 13.28  # CA jerk std-dev (m/s^3)
  kf_process_noise_vel: 2.0  # CV acceleration std-dev (m/s^2)
  imm_p_stay_cv: 0.75  # P(CV->CV). Range 0.60-0.95; lower = CA reacts sooner to braking
  imm_p_return_to_cv: 0.30  # P(CA->CV). Range 0.15-0.50; higher = CA fades faster after a manoeuvre
  kf_measurement_noise: 0.0019  # visual angular variance (rad^2) = sigma 2.5 deg; MUST match tuning.yaml

  anisotropic_bearing_noise:
    enabled: false  # master switch; false = exact previous isotropic behaviour. The true path is STILL NOT TESTED
    sigma_az_deg: 1.32  # total azimuth budget [deg] (RTK yaw + detector)
    sigma_el_deg: 2.63  # total elevation budget [deg] (boot tilt + detector)
  kf_adaptive_cov_max_multiplier: 50.0  # INERT: read but never used, see docs/config_rationale.md
  kf_initial_covariance: 2.0  # initial position variance (m^2)
  kf_mahalanobis_threshold: 34.0  # chi2(3, 0.999). Raised deliberately -- read the doc before changing
  ml_refine: false  # master switch; false = exact previous WLS-only behaviour
  ml_refine_iters: 5  # max Gauss-Newton iterations (stops early at 0.1 mm step)
  normalize_crlb: false  # false = R keeps its raw CRLB scale. NOT a no-op

#DONT TOUCH
triangulation:
  max_pair_age_sec: 0.20  # maximum timestamp separation accepted for one observer1/observer2 pair
  observation_buffer_sec: 1.0  # keep this much recent observation history available for pairing and debug overlays
  triangulation_min_baseline_m: 0.25  # reject pairs whose camera centers are too close for stable geometry
  max_triangulation_error_m: 2.0  # reject midpoint solutions when the two rays remain too far apart
  processing_rate_hz: 100.0  # node timer rate for pruning buffers, coast prediction, and debug housekeeping
  coast_after_sec: 0.15  # how long the filter may go unfed before the timer coasts (s)
  max_coast_sec: 1.0  # hard horizon for open-loop extrapolation (s)
  publish_evaluation_packets: true  # set to true to publish /target/triangulation_evaluation for CMA-ES

  pairing_prediction_enabled: true  # false = pair by closest timestamp only
  pairing_weight_time: 4.0  # w_t: temporal synchronization weight
  pairing_weight_geom: 1.5  # w_g: ray mismatch penalty (geometry quality)
  pairing_weight_innov: 1.5  # w_i: 3D innovation consistency with IMM prediction
  pairing_mahalanobis_chi2: 18.0  # NORMALISES the pairing cost; it is NOT a gate
  pairing_log_best_cost: false  # debug: log winning J, c_t, c_g, c_i at INFO throttle
  single_obs_max_age_sec: 0.15  # max age for an unpaired observation to be fused
  single_obs_min_confidence: 0.60  # min YOLO confidence required to use single-sensor fallback

#DONT TOUCH -- except the px / area values, which MUST be rescaled if you change resolution
kalman_filter:
  # Image-space Kalman filter: the false-positive rejection layer inside each observer.
  # RESOLUTION-COUPLED: the _px / area values below are for 1920x1080.
  kf_enabled: true  # false = every raw detection becomes a ray, no false-positive layer
  kf_sigma_a: 300.0  # 1080 | 720: 200.0 | 480: 100.0 -- px/s^2, scales with k
  kf_sigma_px: 11.0  # 1080 | 720: 7.3 | 480: 3.7
  kf_conf_beta: 1.0  # weight of YOLO confidence in the measurement noise
  kf_conf_min: 0.2  # minimum YOLO confidence accepted
  kf_n_confirm: 3.0  # consecutive detections needed before a ray is published
  kf_max_age: 5  # frames a track survives without a detection
  kf_p_max: 800.0  # 1080 | 720: 356.0 | 480: 89.0  -- varianza px^2, scala con k^2
  kf_nis_window: 15  # samples averaged for the NIS health check
  kf_nis_threshold: 8.0  # per-detection NIS gate
  kf_ghost_timeout_sec: 0.5  # s before a lost track is treated as a ghost
  kf_ghost_reentry_m: 2  # M of N detections needed to revive a ghost track
  kf_ghost_reentry_n: 3  # ... out of the last N candidates
  kf_ghost_reentry_conf_min: 0.35  # minimum confidence for a ghost re-entry
  kf_ghost_reentry_spread_px: 100.0  # 1080 | 720: 67.0 | 480: 33.0
  kf_ego_motion_enabled: true  # compensate the observer own motion between frames
  kf_bbox_area_ref: 3600.0  # 1080 | 720: 1600.0 | 480: 400.0  -- area px^2, scala con k^2
  kf_dist_gamma: 0.2  # distance exponent for the confidence model
  kf_cam_aware_gating_enabled: true  # scale the 2D gate with apparent target size

evaluation:
  odom_topic_suffix: "estimation_manager/odom_main"  # CORRECT for real drones; hw_api/ground_truth is sim-only
  world_frame_suffix: "world_origin"  # real drone RTK origin, V2 uses f9p_origin
  shared_world_origin: true  # true = all drones share one world origin. VERIFY THE Z DATUM before trusting
  gt_aligned_topic: "/target/ground_truth_aligned"  # GT republished by the triangulation node; "" = use the raw topic
  live_monitor_mode: "classic"  # one of: classic | full_3d | minimal_3d
  # Read only by one_drone/launch_sim.sh, not by anything in this repo (parity).
  # false = that script opens the live monitor but skips the prediction evaluator.
  auto_start_with_launch_sim: true

depth_fusion:
  # Range from the RGB-D stream as an extra measurement. Off: the USB 2.1 link cannot carry it.
  enabled: false  # false = no depth subscriber at all (USB 2.1 cannot carry the stream)
  depth_topic_suffix: "rgbd/aligned_depth_to_color/image_raw"
  depth_max_align_ms: 40.0  # max depth/RGB time skew (ms)
  min_range_m: 0.3  # valid sensor range (m)
  max_range_m: 10.0  # valid sensor range (m)
  sample_method: "median"  # one of: median | center_pixel | trimmed_mean
  trimmed_mean_fraction: 0.2  # for trimmed_mean: discard top/bottom fraction
  min_valid_pixel_fraction: 0.001  # reject depth if fewer valid pixels cover the bbox
  depth_sample_stride: 2  # stride for subsampling large bboxes (2 = halve CPU for area > 4000px²)
  gating_enabled: false  # reject depth samples that disagree with the 3D estimate
  gate_k: 3.0  # gate width in sigmas
  max_odom_age_sec: 0.5  # same spirit as tight_coupling.max_3d_age_sec
  max_odom_covariance_trace: 100.0  # disable depth gate if 3D positional uncertainty is too large
  gate_odom_topic: "/target/odometry_estimate"  # [L3-bug2] Dedicated IMM odom topic for the depth consistency
  sigma_z_base_m: 0.02  # depth noise model: sigma_z = base + coeff * z (m)
  sigma_z_range_coeff: 0.01
  fusion_use_range_constraint: true  # apply an accepted depth sample as a 1-D range update
  fusion_range_chi2: 9.0  # chi² threshold for per-ray depth consistency check (1-DOF)

observer_odom_uncertainty:
  # Propagates each observer's own position uncertainty into its ray covariance.
  use_odom_uncertainty: false  # MUST match tuning.yaml, or R differs between tuning and flight
  odom_fallback_variance: 0.01  # m²: isotropic P_odom used when driver publishes zero cov
  odom_max_age_sec: 0.5  # s:  reject stale odometry and fall back to pixel-only
  distance_dependent_noise: true  # WLS: if true, visual sigma = var_px * d^2; false = constant width beam
  odom_max_variance: 1.0  # m²: diagonal clamp on P_odom diagonals; prevents barometric Z-blowup

observer_self_rejection:
  # Stops an observer detecting the OTHER observer instead of the target.
  enabled: true  # master switch; false = zero overhead (no subscriber created)
  max_odom_age_sec: 0.3  # s: reject only when other-observer odom is fresh
  rejection_gate_radius_m: 0.8  # m: physical drone body radius used to compute pixel gate
  rejection_depth_margin_m: 1.5  # m: unused while rejection_only_if_closer=false; kept for future re-enable
  rejection_only_if_closer: false  # false = unconditional geometric exclusion (right for two observers flying together)
